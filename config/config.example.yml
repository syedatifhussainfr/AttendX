# AttendX permission configuration example.
# Re-run npm run config-check after editing.
version: 1
permissions:
  CR:
    dashboard:
      view: true
    attendance:
      view: true
      open: true
      mark: true
      close: true
      correctOpen: true
      correctClosed: false
      reopen: false
      delete: false
    students:
      view: true
      create: false
      update: false
      import: false
      delete: false
    subjects:
      view: true
      manage: false
      delete: false
    timetable:
      view: true
      manage: false
    reports:
      view: true
      export: true
    settings:
      view: false
      manage: false
    users:
      view: false
      create: false
      update: false
      resetCrPassword: false
      delete: false
      manageSessions: false
      modifyAdminPlus: false
    database:
      view: false
    audit:
      view: false
    backups:
      view: false
      create: false
      download: false
      restore: false
  ADMIN:
    dashboard:
      view: true
    attendance:
      view: true
      open: true
      mark: true
